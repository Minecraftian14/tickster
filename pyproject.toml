[project]
name = "tickster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "diskcache>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jugaad-data>=0.35.9",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core",
    "langchain-openai>=1.6.6",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph>=1.2.12",
    "nodezator>=1.5.5",
    "nse-archives>=1.2.4",
    "nsedata>=0.1",
    "pydantic",
    "pydantic-settings>=2.15.0",
    "pyngrok>=8.1.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "upstox-python-sdk>=2.30.0",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build<=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/business"

[tool.pytest.ini_options]
testpaths = ["tests/business"]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "langgraph-cli[inmem]>=0.4.31",
    "pylint>=4.1.2",
    "pytest>=9.1.1",
    "xonsh[full]>=0.24.2",
]

[tool.uvicorn]
factory = false
